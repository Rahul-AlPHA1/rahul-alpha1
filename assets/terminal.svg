    <text class="l" x="18" y="140" style="animation-delay:1.9s"><tspan class="out">› Senior Consultant @ Systems Limited — Confiz</tspan></text>
    <text class="l" x="18" y="162" style="animation-delay:2.2s"><tspan class="out">› Chatterbox · AI-enabled US healthcare app</tspan></text>

    <text class="l" x="18" y="192" style="animation-delay:2.8s"><tspan class="ps">rahool@karachi:~$ </tspan><tspan class="cmd">cat banking.log</tspan></text>
    <text class="l" x="18" y="214" style="animation-delay:3.3s"><tspan class="out">› Led a 4-engineer team · AL-Habib Core Banking</tspan></text>
    <text class="l" x="18" y="236" style="animation-delay:3.6s"><tspan class="out">› 10+ microservices · Kafka · Kubernetes</tspan></text>
    <text class="l" x="18" y="258" style="animation-delay:3.9s"><tspan class="out">› Reconciliation: hours → </tspan><tspan class="ok">minutes ⚡</tspan></text>

    <text class="l" x="18" y="288" style="animation-delay:4.5s"><tspan class="ps">rahool@karachi:~$ </tspan><tspan class="cmd">ls ~/shipped</tspan></text>
    <text class="l" x="18" y="310" style="animation-delay:5s"><tspan class="ok">FakeShield · Zynapse · LendLedger · InterView-Alpha</tspan></text>

