<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400">
  <title>rahool@karachi — terminal</title>
  <style>
    text { font: 13px 'Consolas', 'Cascadia Code', 'Courier New', monospace; }
    .ps  { fill: #00d4ff; }
    .cmd { fill: #e2e8f0; }
    .out { fill: #94a3c4; }
    .hi  { fill: #c4b5fd; }
    .ok  { fill: #4ade80; }
    .l   { opacity: 0; animation: in .35s ease-out forwards; }
    .cur { animation: blink 1s step-end infinite; }
    @keyframes in    { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="480" height="400" rx="14" fill="#050d1a"/>
  <rect x=".75" y=".75" width="478.5" height="398.5" rx="13.5" fill="none" stroke="#1e2d52" stroke-width="1.5"/>
  <path d="M0 14 A14 14 0 0 1 14 0 H466 A14 14 0 0 1 480 14 V36 H0 Z" fill="#0d1b35"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="240" y="22" text-anchor="middle" class="out" style="font-size:12px">rahool@karachi: ~</text>

  <g>
    <text class="l" x="18" y="66"  style="animation-delay:.3s"><tspan class="ps">rahool@karachi:~$ </tspan><tspan class="cmd">whoami</tspan></text>
