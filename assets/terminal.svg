    <text class="l" x="18" y="362" style="animation-delay:6.1s"><tspan class="hi">Ship products, not prototypes. 🚀</tspan></text>
    <rect class="l cur" x="18" y="374" width="9" height="15" fill="#00d4ff" style="animation: in .3s 6.6s forwards, blink 1s step-end 6.9s infinite"/>
